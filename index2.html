<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I co, poznajesz już Otwock? | Śladami Andriollego</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f1eee4;
  --cream: #fffdf7;
  --dark: #202a24;
  --wine: #762f42;
  --green: #294d3b;
  --line: #cfcdbb;
  --muted: #696f65;
  --pale: #e2e7dc;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--dark);
  font-family: "Libre Baskerville", Georgia, serif;
  line-height: 1.7;
}
.page {
  width: min(900px, calc(100% - 32px));
  margin: 35px auto;
}
.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 15px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.back {
  color: var(--wine);
  text-decoration: none;
  letter-spacing: 0;
  text-transform: none;
}
.hero {
  text-align: center;
  padding: 75px 0 45px;
}
.eyebrow {
  color: var(--wine);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
}
h1, h2, h3 {
  font-family: "Cormorant Garamond", Georgia, serif;
}
h1 {
  font-size: clamp(45px, 8vw, 85px);
  line-height: 1;
  font-weight: 500;
  margin: 20px 0;
}
.intro {
  max-width: 650px;
  margin: auto;
  color: #4e574d;
}
.quiz-head {
  text-align: center;
  margin: 35px 0 25px;
}
.quiz-head h2 {
  font-size: clamp(30px, 5vw, 48px);
  font-weight: 500;
  margin: 0;
}
.quiz-head p {
  color: var(--muted);
}
.progress-wrap {
  height: 6px;
  background: #dedccd;
  margin-bottom: 22px;
  border-radius: 10px;
  overflow: hidden;
}
.progress {
  height: 100%;
  width: 0;
  background: var(--wine);
  transition: width .3s;
}
.question-card,
.result {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: clamp(22px, 5vw, 42px);
}
.question-number {
  color: var(--wine);
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.question-card h3 {
  font-size: clamp(25px, 4vw, 35px);
  line-height: 1.25;
  font-weight: 500;
  margin: 15px 0 25px;
}
.answers {
  display: grid;
  gap: 10px;
}
.answer {
  width: 100%;
  padding: 14px 16px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dark);
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition: .2s;
}
.answer:hover:not(:disabled) {
  background: var(--pale);
  border-color: var(--green);
}
.answer:disabled {
  cursor: default;
}
.answer.correct {
  background: #e0eadf;
  border-color: var(--green);
}
.answer.wrong {
  background: #f0e1e2;
  border-color: var(--wine);
}
.feedback {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: var(--pale);
  border-left: 3px solid var(--green);
  font-size: 14px;
}
.feedback.show {
  display: block;
}
.controls {
  display: flex;
  justify-content: flex-end;
  margin-top: 22px;
}
.button {
  border: 0;
  background: var(--green);
  color: white;
  padding: 13px 22px;
  font: inherit;
  cursor: pointer;
}
.button:hover {
  background: var(--dark);
}
.result {
  display: none;
  text-align: center;
}
.result.show {
  display: block;
}
.result-score {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(65px, 12vw, 110px);
  line-height: 1;
  color: var(--wine);
  margin: 20px 0;
}
.result h2 {
  font-size: 40px;
  font-weight: 500;
  margin: 0;
}
.result p {
  color: var(--muted);
}
.result .button {
  margin-top: 15px;
}
.bottom {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 35px 0 15px;
  border-top: 1px solid var(--line);
  margin-top: 50px;
}
@media (max-width: 560px) {
  .page {
    margin: 20px auto;
  }
  .topline {
    font-size: 10px;
  }
  .answer {
    padding: 13px;
  }
}
</style>
</head>
<body>
<main class="page">
<div class="topline">
  <span>Śladami Andriollego</span>
  <a class="back" href="./">← Wróć do mapy</a>
</div>
<header class="hero">
  <div class="eyebrow">Koniec trasy?</div>
  <h1>I co, poznajesz<br>już Otwock?</h1>
  <p class="intro">
    Przeszedłeś całą trasę i naprawdę ciekawe historie. Ale ile z nich udało Ci się zapamiętać?
<section class="quiz-head">
  <h2>No dobra, sprawdźmy, co zapamiętałeś</h2>
</h1>
</section>
<div class="progress-wrap">
  <div class="progress" id="progress"></div>
</div>
<section class="question-card" id="question-card">
  <div class="question-number" id="question-number"></div>
  <h3 id="question"></h3>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="button" id="next" hidden>Następne pytanie →</button>
  </div>
</section>
<section class="result" id="result">
  <div class="eyebrow">Quiz zakończony</div>
  <h2 id="result-title"></h2>
  <div class="result-score" id="score"></div>
  <p id="result-text"></p>
  <button class="button" id="restart">Spróbuj jeszcze raz</button>
</section>
</main>
<script>;
const questions = [
{
q: "W którym roku kolej dotarła do Otwocka?",
a: ["1867 r.", "1877 r.", "1887 r.", "1897 r."],
correct: 1,
info: "1877 rok. Wtedy do Otwocka dotarła Kolej Nadwiślańska, łącząca miejscowość z Warszawą."
},
{
q: "Kto był twórcą związanym z posiadłością Brzegi nad Świdrem?",
a: ["Józef Chełmoński", "Stanisław Witkiewicz", "Michał Elwiro Andriolli", "Julian Fałat"],
correct: 2,
info: "Michał Elwiro Andriolli, malarz i ilustrator, zamieszkał w posiadłości Brzegi nad Świdrem."
},
{
q: "Który budynek jest jednym z najbardziej charakterystycznych przykładów świdermajeru?",
a: ["Pensjonat Abrama Gurewicza", "Pałac Kultury i Nauki", "Zamek Królewski", "Belweder"],
correct: 0,
info: "Pensjonat Abrama Gurewicza. Jego drewniana konstrukcja, werandy i dekoracyjne detale nawiązują do stylu świdermajer."
},
{
q: "W którym roku Otwock otrzymał prawa miejskie?",
a: ["1905 r.", "1910 r.", "1916 r.", "1924 r."],
correct: 2,
info: "1916 rok. Właśnie wtedy Otwock uzyskał prawa miejskie."
},
{
q: "Jak nazywała się posiadłość Michała Elwiro Andriollego nad Świdrem?",
a: ["Zacisze", "Brzegi", "Leśniczówka", "Zalesie"],
correct: 1,
info: "Brzegi. Taką nazwę nosiła posiadłość artysty położona nad Świdrem."
},
{
q: "Jaka rzeka jest szczególnie związana z historią Otwocka i Andriollego?",
a: ["Wisła", "Narew", "Świder", "Pilica"],
correct: 2,
info: "Świder. Nad jego brzegiem znajdowała się posiadłość Andriollego, a okolica z czasem stała się popularnym miejscem wypoczynku."
},
{
q: "Co przyczyniło się do rozwoju Otwocka jako miejscowości letniskowej?",
a: ["Rozwój kolei i dogodny dojazd z Warszawy", "Odkrycie złóż węgla", "Powstanie dużego portu", "Rozwój przemysłu stoczniowego"],
correct: 0,
info: "Połączenie kolejowe z Warszawą. Dzięki niemu do Otwocka łatwiej docierali mieszkańcy stolicy szukający odpoczynku poza miastem."
},
{
q: "Z jakiego materiału najczęściej budowano domy w stylu świdermajer?",
a: ["Z cegły", "Z kamienia", "Z betonu", "Z drewna"],
correct: 3,
info: "Drewno. Z niego wznoszono charakterystyczne wille i pensjonaty z werandami oraz ozdobnymi elementami."
},
{
q: "W jakim celu dawniej przyjeżdżano do Otwocka?",
a: ["Na wypoczynek i leczenie", "Do portu handlowego", "Na targi przemysłowe", "Do kopalni"],
correct: 0,
info: "Na wypoczynek i leczenie. Otwock słynął z sanatoriów, pensjonatów oraz korzystnego dla zdrowia klimatu."
},
{
q: "Co jest charakterystyczne dla architektury świdermajer?",
a: ["Surowe betonowe bryły", "Drewniane werandy i ażurowe zdobienia", "Wysokie szklane fasady", "Kamienne mury obronne"],
correct: 1,
info: "Drewniane werandy, ozdobne balustrady i ażurowe wykończenia. To właśnie te elementy nadają świdermajerom charakterystyczny wygląd."
}
];
let current = 0;
let points = 0;
let answered = false;
const questionNumber = document.getElementById("question-number");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("next");
const progress = document.getElementById("progress");
const card = document.getElementById("question-card");
const result = document.getElementById("result");
function renderQuestion() {
  answered = false;
  const item = questions[current];
  questionNumber.textContent = `Pytanie ${current + 1} z ${questions.length}`;
  questionEl.textContent = item.q;
  answersEl.innerHTML = "";
  feedbackEl.textContent = "";
  feedbackEl.classList.remove("show");
  nextBtn.hidden = true;
  nextBtn.textContent = current === questions.length - 1 ? "Zobacz wynik →" : "Następne pytanie →";
  progress.style.width = `${(current / questions.length) * 100}%`;
  item.a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = `${String.fromCharCode(65 + index)}. ${answer}`;
    button.addEventListener("click", () => chooseAnswer(index));
    answersEl.appendChild(button);
  });
}
function chooseAnswer(index) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = [...answersEl.querySelectorAll(".answer")];
  buttons.forEach((button, i) => {
    button.disabled = true;
    if (i === item.correct) button.classList.add("correct");
    if (i === index && index !== item.correct) button.classList.add("wrong");
  });
  points += index === item.correct ? 1 : 0;
  feedbackEl.textContent = item.info;
  feedbackEl.classList.add("show");
  nextBtn.hidden = false;
}
nextBtn.addEventListener("click", () => {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    card.style.display = "none";
    result.classList.add("show");
    progress.style.width = "100%";
    document.getElementById("score").textContent = `${points}/10`;
    const titles = [
      "Otwock nie ma już przed Tobą wielu tajemnic!",
      "Całkiem nieźle! Widać, że uważnie zwiedzałeś!",
      "Coś już zostało w pamięci, ale Otwock ma jeszcze kilka sekretów.",
      "Chyba nie wszystkie przystanki udało się zapamiętać.",
      "Wygląda na to, że przydałaby się jeszcze jedna wycieczka!"
    ];
    const texts = [
      "Komplet punktów. Wszystko zapamiętane!",
      "Naprawdę dobrze znasz historię miasta.",
      "Większość historii została w pamięci.",
      "Trochę już wiesz, ale kilka rzeczy umknęło.",
      "Otwock chyba ma przed Tobą jeszcze sporo do odkrycia."
    ];
    let tier =
      points === 10 ? 0 :
      points >= 8 ? 1 :
      points >= 6 ? 2 :
      points >= 3 ? 3 : 4;
    document.getElementById("result-title").textContent = titles[tier];
    document.getElementById("result-text").textContent = texts[tier];
  }
});
document.getElementById("restart").addEventListener("click", () => {
  current = 0;
  points = 0;
  card.style.display = "";
  result.classList.remove("show");
  renderQuestion();
});
renderQuestion();
</script>
</body>
</html>
